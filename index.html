<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 生日礼物心愿单 · For My Bestie</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Long+Cang&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #ffb3c6 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    padding: 40px 20px;
  }

  /* 背景飘浮的爱心 */
  .heart {
    position: fixed;
    color: rgba(255, 255, 255, 0.6);
    animation: float 8s linear infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
    color: #fff;
  }

  .header h1 {
    font-family: 'ZCOOL KuaiLe', 'ZCOOL QingKe HuangYou', cursive;
    font-size: 56px;
    background: linear-gradient(135deg, #ff6b9d 0%, #d6336c 50%, #ff8fab 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    letter-spacing: 3px;
    text-shadow: 2px 4px 12px rgba(255, 143, 171, 0.3);
    transform: rotate(-2deg);
    display: inline-block;
  }

  .header p {
    font-size: 16px;
    color: #a0185a;
    line-height: 1.8;
  }

  .header .emoji {
    font-size: 24px;
    margin: 0 6px;
  }

  .gifts-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    margin-bottom: 36px;
  }

  .gift-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 32px 24px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 3px solid transparent;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  .gift-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255, 182, 193, 0.4) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .gift-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 40px rgba(214, 51, 108, 0.25);
    border-color: #ff8fab;
  }

  .gift-card:hover::before {
    opacity: 1;
  }

  .gift-card.selected {
    background: linear-gradient(135deg, #ffb3c6 0%, #ff8fab 100%);
    color: #fff;
    border-color: #d6336c;
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 16px 32px rgba(214, 51, 108, 0.4);
  }

  .gift-card.selected .gift-icon {
    transform: scale(1.1) rotate(10deg);
  }

  .gift-card.selected .gift-title,
  .gift-card.selected .gift-desc {
    color: #fff;
  }

  .gift-card .check-mark {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #fff;
    color: #d6336c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    opacity: 0;
    transform: scale(0);
    transition: all 0.3s;
  }

  .gift-card.selected .check-mark {
    opacity: 1;
    transform: scale(1);
  }

  .gift-icon {
    font-size: 64px;
    margin-bottom: 16px;
    display: inline-block;
    transition: transform 0.4s;
  }

  .gift-title {
    font-size: 22px;
    font-weight: 700;
    color: #d6336c;
    margin-bottom: 8px;
    transition: color 0.3s;
  }

  .gift-desc {
    font-size: 14px;
    color: #a0185a;
    line-height: 1.6;
    transition: color 0.3s;
  }

  .actions {
    text-align: center;
    margin-top: 20px;
  }

  .submit-btn {
    background: linear-gradient(135deg, #ff8fab 0%, #d6336c 100%);
    color: #fff;
    border: none;
    padding: 16px 48px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(214, 51, 108, 0.35);
    transition: all 0.3s;
    font-family: inherit;
  }

  .submit-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(214, 51, 108, 0.5);
  }

  .submit-btn:active {
    transform: translateY(0);
  }

  .submit-btn:disabled {
    background: #ddd;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .hint {
    margin-top: 16px;
    color: #a0185a;
    font-size: 13px;
  }

  /* 弹窗 */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(214, 51, 108, 0.4);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.3s;
  }

  .modal-overlay.active {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: #fff;
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .modal-icon {
    font-size: 64px;
    margin-bottom: 16px;
  }

  .modal h2 {
    color: #d6336c;
    font-size: 28px;
    margin-bottom: 12px;
    font-family: 'ZCOOL KuaiLe', cursive;
    letter-spacing: 2px;
  }

  .modal p {
    color: #666;
    line-height: 1.8;
    margin-bottom: 20px;
  }

  .selected-list {
    background: linear-gradient(135deg, #ffe5ec, #ffc2d1);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 24px;
  }

  .selected-list .item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 6px 0;
    color: #d6336c;
    font-weight: 500;
  }

  .modal-btn {
    background: linear-gradient(135deg, #ff8fab 0%, #d6336c 100%);
    color: #fff;
    border: none;
    padding: 12px 36px;
    font-size: 16px;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }

  @media (max-width: 600px) {
    .header h1 { font-size: 36px; }
    .gifts-grid { grid-template-columns: 1fr; gap: 16px; }
    .gift-icon { font-size: 56px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎂 生日礼物心愿单 🎁</h1>
    <p>
      亲爱的小寿星 <span class="emoji">💕</span><br>
      25岁的你值得世界上最好的宠爱<br>
      挑一个你最心动的礼物吧 ✨
    </p>
  </div>

  <div class="gifts-grid" id="giftsGrid">
    <div class="gift-card" data-id="1">
      <div class="check-mark">✓</div>
      <div class="gift-icon">💆‍♀️</div>
      <div class="gift-title">头发护理</div>
      <div class="gift-desc">让发丝顺滑闪耀 ✨</div>
    </div>

    <div class="gift-card" data-id="2">
      <div class="check-mark">✓</div>
      <div class="gift-icon">💄</div>
      <div class="gift-title">美妆护肤</div>
      <div class="gift-desc">每天都是闪亮的你 💖</div>
    </div>

    <div class="gift-card" data-id="3">
      <div class="check-mark">✓</div>
      <div class="gift-icon">🧖‍♀️</div>
      <div class="gift-title">身体保养</div>
      <div class="gift-desc">放松颈椎腰椎，缓解久坐疲惫 🌸</div>
    </div>

    <div class="gift-card" data-id="4">
      <div class="check-mark">✓</div>
      <div class="gift-icon">📷</div>
      <div class="gift-title">记录美好</div>
      <div class="gift-desc">留住每一个高光时刻 💫</div>
    </div>
  </div>

  <div class="actions">
    <button class="submit-btn" id="submitBtn" disabled>告诉我你的心动 💕</button>
    <div class="hint" id="hint">提示：选一个你最心动的礼物吧 ~</div>
  </div>
</div>

<!-- 结果弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <h2>收到啦！</h2>
    <p>谢谢你告诉我你的心愿<br>我会用心准备好礼物 💝</p>
    <div class="selected-list" id="selectedList"></div>
    <button class="modal-btn" id="closeModal">好哒，期待生日 🎂</button>
  </div>
</div>

<script>
  const cards = document.querySelectorAll('.gift-card');
  const submitBtn = document.getElementById('submitBtn');
  const hint = document.getElementById('hint');
  const modal = document.getElementById('modal');
  const selectedList = document.getElementById('selectedList');
  const closeModal = document.getElementById('closeModal');

  const giftMap = {
    '1': { icon: '💆‍♀️', name: '头发护理' },
    '2': { icon: '💄', name: '美妆护肤' },
    '3': { icon: '🧖‍♀️', name: '身体保养' },
    '4': { icon: '📷', name: '记录美好' }
  };

  cards.forEach(card => {
    card.addEventListener('click', () => {
      // 单选：先清除其他卡片的选中状态
      cards.forEach(c => {
        if (c !== card) c.classList.remove('selected');
      });
      card.classList.toggle('selected');
      updateButton();
    });
  });

  function updateButton() {
    const selected = document.querySelectorAll('.gift-card.selected');
    if (selected.length > 0) {
      submitBtn.disabled = false;
      const gift = giftMap[selected[0].dataset.id];
      hint.textContent = `你选择了：${gift.icon} ${gift.name} 💕`;
    } else {
      submitBtn.disabled = true;
      hint.textContent = '提示：选一个你最心动的礼物吧 ~';
    }
  }

  submitBtn.addEventListener('click', () => {
    const selected = document.querySelectorAll('.gift-card.selected');
    if (selected.length === 0) return;

    selectedList.innerHTML = '';
    selected.forEach(card => {
      const id = card.dataset.id;
      const gift = giftMap[id];
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `<span style="font-size:20px">${gift.icon}</span> ${gift.name}`;
      selectedList.appendChild(item);
    });

    modal.classList.add('active');
    launchConfetti();
  });

  closeModal.addEventListener('click', () => {
    modal.classList.remove('active');
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('active');
  });

  // 飘浮爱心背景
  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = ['💕', '💖', '💗', '🌸', '✨'][Math.floor(Math.random() * 5)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (16 + Math.random() * 24) + 'px';
    heart.style.animationDuration = (6 + Math.random() * 6) + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 12000);
  }
  setInterval(createHeart, 600);

  // 撒花动画
  function launchConfetti() {
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.style.position = 'fixed';
        c.style.top = '50%';
        c.style.left = '50%';
        c.style.fontSize = '24px';
        c.style.zIndex = 2000;
        c.style.pointerEvents = 'none';
        c.innerHTML = ['🎉', '🎊', '💖', '✨', '🌸'][Math.floor(Math.random() * 5)];
        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 200;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;
        c.style.transition = 'all 1.2s cubic-bezier(0.2, 0.8, 0.4, 1)';
        document.body.appendChild(c);
        requestAnimationFrame(() => {
          c.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random() * 720}deg)`;
          c.style.opacity = '0';
        });
        setTimeout(() => c.remove(), 1300);
      }, i * 30);
    }
  }
</script>

</body>
</html>
